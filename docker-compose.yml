services:
  # Laravel Backend
  backend:
    build: ./backend
    container_name: auditnet_backend
    volumes:
      - ./backend:/var/www
      - ./backend/storage:/var/www/storage
    command: sh -c "composer install --no-dev --optimize-autoloader --no-interaction && until php artisan migrate --force; do echo 'Waiting for database...'; sleep 3; done; php artisan serve --host=0.0.0.0 --port=8000"
    environment:
      - APP_URL=https://xn--80aidlz3acc.xn--p1ai
      - FRONTEND_URL=https://xn--80aidlz3acc.xn--p1ai
      - CORS_ALLOWED_ORIGINS=https://xn--80aidlz3acc.xn--p1ai,http://xn--80aidlz3acc.xn--p1ai,http://xn--80aidlz3acc.xn--p1ai:5173,http://138.16.174.40,http://138.16.174.40:5173,http://localhost:5173
      - SANCTUM_STATEFUL_DOMAINS=xn--80aidlz3acc.xn--p1ai,xn--80aidlz3acc.xn--p1ai:5173,аудитнет.рф,localhost,localhost:5173
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=auditnet_db
      - DB_USERNAME=audituser
      - DB_PASSWORD=secret_vps_password_2026
    depends_on:
      db:
        condition: service_healthy
      lighthouse:
        condition: service_started
    networks:
      - default

  # Queue worker (выполняет фоновые аудиты сайтов)
  worker:
    build: ./backend
    container_name: auditnet_worker
    restart: unless-stopped
    volumes:
      - ./backend:/var/www
      - ./backend/storage:/var/www/storage
    command: sh -c "composer install --no-dev --optimize-autoloader --no-interaction && php artisan queue:work --tries=3 --timeout=300 --sleep=3"
    environment:
      - APP_URL=https://xn--80aidlz3acc.xn--p1ai
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=auditnet_db
      - DB_USERNAME=audituser
      - DB_PASSWORD=secret_vps_password_2026
      - QUEUE_CONNECTION=database
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_started
      lighthouse:
        condition: service_started
    networks:
      - default

  # Планировщик (раз в минуту проверяет расписание и ставит аудиты в очередь)
  scheduler:
    build: ./backend
    container_name: auditnet_scheduler
    restart: unless-stopped
    volumes:
      - ./backend:/var/www
      - ./backend/storage:/var/www/storage
    command: sh -c "composer install --no-dev --optimize-autoloader --no-interaction && php artisan schedule:work"
    environment:
      - APP_URL=https://xn--80aidlz3acc.xn--p1ai
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=auditnet_db
      - DB_USERNAME=audituser
      - DB_PASSWORD=secret_vps_password_2026
      - QUEUE_CONNECTION=database
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_started
    networks:
      - default

  # Vue Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: https://xn--80aidlz3acc.xn--p1ai/api
    container_name: auditnet_frontend
    environment:
      - VITE_API_URL=https://xn--80aidlz3acc.xn--p1ai/api
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
    stdin_open: true
    tty: true

  caddy:
    image: caddy:2-alpine
    container_name: auditnet_caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend
    networks:
      - default

  db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      - MYSQL_DATABASE=auditnet_db
      - MYSQL_USER=audituser
      - MYSQL_PASSWORD=secret_vps_password_2026
      - MYSQL_ROOT_PASSWORD=secret_vps_password_2026
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "localhost", "-u", "audituser", "-psecret_vps_password_2026"]
      interval: 5s
      timeout: 5s
      retries: 20

  phpmyadmin:
    image: phpmyadmin:5.2
    environment:
      - PMA_HOST=db
      - PMA_USER=audituser
      - PMA_PASSWORD=secret_vps_password_2026
    ports:
      - "8080:80"
    depends_on:
      - db

  lighthouse:
    build:
      context: ./lighthouse
      dockerfile: Dockerfile
    container_name: auditnet_lighthouse
    ports:
      - "3000:3000"
    volumes:
      - ./lighthouse:/app
      - /app/node_modules
    networks:
      - default

volumes:
  db_data:
  caddy_data:
  caddy_config:
